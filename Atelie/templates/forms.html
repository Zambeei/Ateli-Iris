<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
    <title>Novo cliente</title>
</head>

<body>
    <main>
        <header>
            <div class="logo-container">
                <img src="{{ url_for('static', filename='img_inicio/img_logo.jpeg') }}" alt="Irís Atelier"
                    style="display: block; margin: 0 auto; border-radius: 50%; width: 165px; height: 165px; object-fit: cover;">
            </div>

            <h1>Encontre seu vestido</h1>

            <h5>
                Para ser cliente é necessário preencher corretamente o formulário abaixo
                com os respectivos dados cadastrais. Os campos são de preenchimento
                obrigatórios e essenciais para realizarmos o envio do seu futuro pedido.
            </h5>
        </header>

        <form action="{{ url_for('salvar_cliente') }}" method="POST">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" maxlength="100" required placeholder="Digite o seu nome">

            <label for="email">Email</label>
            <input id="email" name="email" type="email" maxlength="120" required placeholder="Digite o seu melhor E-mail">

            <label for="telefone">Telefone opcional</label>
            <input id="telefone" name="telefone" type="text" maxlength="20" placeholder="Digite o seu telefone">

            <label for="cpf">CPF opcional (somente números)</label>
            <input id="cpf" name="cpf" type="text" maxlength="11" pattern="[0-9]{11}" placeholder="Digite o seu CPF">

            <button type="submit">Salvar Cadastro</button>
        </form>
    </main>
</body>

</html>
